services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - devcom-data:/app/data
      - ./backend/secrets:/run/secrets:ro
    environment:
      HOST: 0.0.0.0
      DATA_FILE: /app/data/devcom.json

volumes:
  devcom-data:
